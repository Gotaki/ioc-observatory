apiVersion: batch/v1
kind: CronJob
metadata:
  name: urlhaus-collector
spec:
  schedule: "*/15 * * * *"        # every 15 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: collector
              image: urlhaus-collector:0.5
              imagePullPolicy: IfNotPresent
              env:
                - name: ABUSE_CH_AUTH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: abuse-ch
                      key: ABUSE_CH_AUTH_KEY
                # Where to push metrics: the Collector's OTLP/HTTP port (4318).
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://otel-collector.monitoring.svc.cluster.local:4318"
                  # Postgres connection (psycopg reads these PG* variables automatically)
                - name: PGHOST          # Service name from k8s/postgres.yaml
                  value: postgres
                - name: PGDATABASE      # matches POSTGRES_DB
                  value: ioc
                - name: PGUSER          # matches POSTGRES_USER
                  value: ioc
                - name: PGPASSWORD      # pulled from the Secret, never stored in this file
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: POSTGRES_PASSWORD
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 512Mi}
